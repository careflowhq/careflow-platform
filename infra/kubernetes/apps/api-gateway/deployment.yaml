apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: careflow-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/part-of: careflow-platform
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: wait-for-backends
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              for svc in auth-service:8081 patient-service:8082 clinic-service:8083 followup-service:8084 notification-service:8085; do
                host="${svc%%:*}"
                port="${svc##*:}"
                until wget -qO- "http://${host}:${port}/actuator/health" 2>/dev/null | grep -q UP; do
                  echo "waiting for ${host}..."
                  sleep 3
                done
              done
      containers:
        - name: api-gateway
          image: careflow/api-gateway:0.0.1-SNAPSHOT
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: JAVA_OPTS
              value: -Xms128m -Xmx384m
            - name: CAREFLOW_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: careflow-app-secrets
                  key: CAREFLOW_JWT_SECRET
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
