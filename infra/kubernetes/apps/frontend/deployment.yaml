apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: careflow-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: careflow-platform
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: wait-for-api-gateway
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -qO- http://api-gateway:8080/actuator/health 2>/dev/null | grep -q UP; do
                echo "waiting for api-gateway..."
                sleep 3
              done
      containers:
        - name: frontend
          image: careflow/frontend:0.0.1-SNAPSHOT
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: API_GATEWAY_URL
              value: http://api-gateway:8080
          readinessProbe:
            exec:
              command:
                - wget
                - -qO-
                - http://localhost:3000/
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - wget
                - -qO-
                - http://localhost:3000/
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
