apiVersion: v1
kind: Secret
metadata:
  name: careflow-app-secrets
  labels:
    app.kubernetes.io/part-of: careflow-platform
type: Opaque
stringData:
  CAREFLOW_JWT_SECRET: careflow-local-jwt-secret-min-32-chars!!
  CAREFLOW_INTERNAL_API_KEY: careflow-local-internal-api-key-dev
