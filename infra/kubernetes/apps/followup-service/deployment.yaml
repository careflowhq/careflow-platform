apiVersion: apps/v1
kind: Deployment
metadata:
  name: followup-service
  labels:
    app.kubernetes.io/name: followup-service
    app.kubernetes.io/part-of: careflow-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: followup-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: followup-service
        app.kubernetes.io/part-of: careflow-platform
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432 -U "$PGUSER"; do
                echo "waiting for postgres..."
                sleep 2
              done
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z rabbitmq 5672; do
                echo "waiting for rabbitmq..."
                sleep 2
              done
        - name: wait-for-patient-service
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -qO- http://patient-service:8082/actuator/health 2>/dev/null | grep -q UP; do
                echo "waiting for patient-service..."
                sleep 3
              done
      containers:
        - name: followup-service
          image: careflow/followup-service:0.0.1-SNAPSHOT
          imagePullPolicy: Never
          ports:
            - containerPort: 8084
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: JAVA_OPTS
              value: -Xms128m -Xmx384m
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
