# Local Kind credentials only — override via infra/kubernetes/.env.local (see docs/kubernetes).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: careflow-platform
type: Opaque
stringData:
  POSTGRES_USER: careflow
  POSTGRES_PASSWORD: careflow-local-k8s-dev
  POSTGRES_DB: postgres
