version: '3.9'

# Optional: copy .env.example to infra/docker/.env for shared secrets when containerizing services.
# Java services read CAREFLOW_* from the host environment when run via mvn spring-boot:run.

volumes:
  postgres-auth-data:
  postgres-patient-data:
  postgres-clinic-data:
  postgres-followup-data:
  postgres-notification-data:

services:

  postgres-auth:
    image: postgres:16
    container_name: postgres-auth
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: careflow
      POSTGRES_PASSWORD: careflow
    ports:
      - "5433:5432"
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data

  postgres-patient:
    image: postgres:16
    container_name: postgres-patient
    environment:
      POSTGRES_DB: patient_db
      POSTGRES_USER: careflow
      POSTGRES_PASSWORD: careflow
    ports:
      - "5434:5432"
    volumes:
      - postgres-patient-data:/var/lib/postgresql/data

  postgres-clinic:
    image: postgres:16
    container_name: postgres-clinic
    environment:
      POSTGRES_DB: clinic_db
      POSTGRES_USER: careflow
      POSTGRES_PASSWORD: careflow
    ports:
      - "5435:5432"
    volumes:
      - postgres-clinic-data:/var/lib/postgresql/data

  postgres-followup:
    image: postgres:16
    container_name: postgres-followup
    environment:
      POSTGRES_DB: followup_db
      POSTGRES_USER: careflow
      POSTGRES_PASSWORD: careflow
    ports:
      - "5436:5432"
    volumes:
      - postgres-followup-data:/var/lib/postgresql/data

  postgres-notification:
    image: postgres:16
    container_name: postgres-notification
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: careflow
      POSTGRES_PASSWORD: careflow
    ports:
      - "5437:5432"
    volumes:
      - postgres-notification-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"