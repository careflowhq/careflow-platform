# CareFlow — build all application images without starting the stack.
# Usage (from infra/docker):
#   docker compose -f docker-compose.build.yml build
#   docker compose -f docker-compose.build.yml build auth-service   # single service

name: careflow-build

services:
  auth-service:
    image: careflow/auth-service:${CAREFLOW_VERSION:-0.0.1-SNAPSHOT}
    build:
      context: ../../backend/auth-service
      dockerfile: ../../infra/docker/Dockerfile.spring-service
      args:
        SERVICE_PORT: 8081
        SERVICE_NAME: auth-service
        BUILD_VERSION: ${CAREFLOW_VERSION:-0.0.1-SNAPSHOT}

  clinic-service:
    image: careflow/clinic-service:${CAREFLOW_VERSION:-0.0.1-SNAPSHOT}
    build:
      context: ../../backend/clinic-service
      dockerfile: ../../infra/docker/Dockerfile.spring-service
      args:
        SERVICE_PORT: 8083
        SERVICE_NAME: clinic-service
        BUILD_VERSION: ${CAREFLOW_VERSION:-0.0.1-SNAPSHOT}

  patient-service:
    image: careflow/patient-service:${CAREFLOW_VERSION:-0.0.1-SNAPSHOT}
    build:
      context: ../../backend/patient-service
      dockerfile: ../../infra/docker/Dockerfile.spring-service
      args:
        SERVICE_PORT: 8082
        SERVICE_NAME: patient-service
        BUILD_VERSION: ${CAREFLOW_VERSION:-0.0.1-SNAPSHOT}

  followup-service:
    image: careflow/followup-service:${CAREFLOW_VERSION:-0.0.1-SNAPSHOT}
    build:
      context: ../../backend/followup-service
      dockerfile: ../../infra/docker/Dockerfile.spring-service
      args:
        SERVICE_PORT: 8084
        SERVICE_NAME: followup-service
        BUILD_VERSION: ${CAREFLOW_VERSION:-0.0.1-SNAPSHOT}

  notification-service:
    image: careflow/notification-service:${CAREFLOW_VERSION:-0.0.1-SNAPSHOT}
    build:
      context: ../../backend/notification-service
      dockerfile: ../../infra/docker/Dockerfile.spring-service
      args:
        SERVICE_PORT: 8085
        SERVICE_NAME: notification-service
        BUILD_VERSION: ${CAREFLOW_VERSION:-0.0.1-SNAPSHOT}

  api-gateway:
    image: careflow/api-gateway:${CAREFLOW_VERSION:-0.0.1-SNAPSHOT}
    build:
      context: ../../backend/api-gateway
      dockerfile: ../../infra/docker/Dockerfile.spring-service
      args:
        SERVICE_PORT: 8080
        SERVICE_NAME: api-gateway
        BUILD_VERSION: ${CAREFLOW_VERSION:-0.0.1-SNAPSHOT}

  frontend:
    image: careflow/frontend:${CAREFLOW_VERSION:-0.0.1-SNAPSHOT}
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        API_GATEWAY_URL: http://api-gateway:8080
        BUILD_VERSION: ${CAREFLOW_VERSION:-0.0.1-SNAPSHOT}
