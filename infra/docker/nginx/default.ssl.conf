# HTTPS — activar con scripts/setup-ssl.sh (copia a default.conf)

upstream careflow_frontend {
    server frontend:3000;
}

upstream careflow_gateway {
    server api-gateway:8080;
}

server {
    listen 80;
    server_name app.careflowhq.org careflowhq.org www.careflowhq.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.careflowhq.org careflowhq.org www.careflowhq.org;

    ssl_certificate /etc/letsencrypt/live/app.careflowhq.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.careflowhq.org/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://careflow_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://careflow_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
