server:
  port: 8085

spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://localhost:5437/notification_db
    username: careflow
    password: careflow

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

management:
  endpoints:
    web:
      exposure:
        include: health,info

careflow:
  rabbitmq:
    exchange: careflow.events
    queue: notification-service.queue
  patient-service:
    base-url: http://localhost:8082
