careflow:
  jwt:
    secret: careflow-secret-key-careflow-secret-key

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${careflow.test.wiremock-uri}
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=1
            - id: patient-service
              uri: ${careflow.test.wiremock-uri}
              predicates:
                - Path=/api/patients/**
              filters:
                - StripPrefix=1
            - id: clinic-service
              uri: ${careflow.test.wiremock-uri}
              predicates:
                - Path=/api/clinics/**
              filters:
                - StripPrefix=1
            - id: followup-service
              uri: ${careflow.test.wiremock-uri}
              predicates:
                - Path=/api/followups/**
              filters:
                - StripPrefix=1
