server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5433/auth_db
    username: careflow
    password: careflow

  jpa:
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        format_sql: true

    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

careflow:
  jwt:
    secret: ${CAREFLOW_JWT_SECRET:careflow-secret-key-careflow-secret-key}
  clinic-service:
    url: http://localhost:8083
  internal:
    api-key: ${CAREFLOW_INTERNAL_API_KEY:careflow-internal-dev-key}
  invite:
    expiration-days: 7
