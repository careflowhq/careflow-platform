server:
  port: 8084

spring:
  application:
    name: followup-service

  datasource:
    url: jdbc:postgresql://localhost:5436/followup_db
    username: careflow
    password: careflow

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

management:
  endpoints:
    web:
      exposure:
        include: health,info

careflow:
  followup:
    # Marks PENDING follow-ups past scheduledDate as MISSED (every 15 minutes).
    overdue-check-cron: "0 */15 * * * *"
  rabbitmq:
    exchange: careflow.events
  patient-service:
    base-url: http://localhost:8082
